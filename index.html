<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>Base Converter</title>
  <link rel="stylesheet" href="style.css"/>
</head>

<body>
  <p id="display1"></p>
  <p id="display2"></p>
  <br>
  <button class="number" alt="0" onclick=addNumber(0)>0</button>
  <button class="number" alt="1" onclick=addNumber(1)>1</button>
  <button class="number" alt="2" onclick=addNumber(2)>2</button>
  <button class="number" alt="3" onclick=addNumber(3)>3</button>
  <button class="number" alt="4" onclick=addNumber(4)>4</button>
  <button class="number" alt="5" onclick=addNumber(5)>5</button>
  <button class="number" alt="6" onclick=addNumber(6)>6</button>
  <button class="number" alt="7" onclick=addNumber(7)>7</button>
  <button class="number" alt="8" onclick=addNumber(8)>8</button>
  <button class="number" alt="9" onclick=addNumber(9)>9</button>
  <br>
  <button class="number" alt="A" onclick="addLetter('A')">A</button>
  <button class="number" alt="B" onclick="addLetter('B')">B</button>
  <button class="number" alt="C" onclick="addLetter('C')">C</button>
  <button class="number" alt="D" onclick="addLetter('D')">D</button>
  <button class="number" alt="E" onclick="addLetter('E')">E</button>
  <button class="number" alt="F" onclick="addLetter('F')">F</button>
  <button class="doublenumber" alt="Backspace" onclick="backspace()">Backspace</button>
  <button class="doublenumber" alt="Confirm" onclick="nextStep()">Confirm</button>


  <script src="script.js"></script>
</body>
